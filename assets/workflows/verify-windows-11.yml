# WinPilot - Windows 11 Pro virtual machine session (managed by the WinPilot app).
#
# How it works
# - Runs Windows 11 Pro (x64) inside Docker with KVM, using the open-source dockur/windows
#   image: https://github.com/dockur/windows
# - Runner: ubuntu-latest. KVM (/dev/kvm) was verified available there by the WinPilot
#   probe workflow. The job fails if /dev/kvm is missing; there is no silent fallback.
# - Windows user and password come from the repository secret WINPILOT_WIN_PASSWORD and
#   are passed to the VM at first install only. They are masked in logs.
# - The VM disk is saved at the end of every session as an encrypted backup (BACKUP_PASSWORD)
#   in a pre-release named win-backup-*. The newest valid backups are restored next time.
#   The last two valid backups are kept; older ones are deleted only after a new backup is verified.
# - Runner files are removed when the job ends. The backup release is the only persistent state.
#
# Honest limits
# - A finished workflow run does NOT mean Windows or RDP is ready. The readiness step checks the
#   RDP port inside the VM; the app checks the Tailscale address from the phone.
# - Losing BACKUP_PASSWORD makes existing backups unreadable.
#
# Markers "WINPILOT|KEY=VALUE" are parsed by the app. Secrets are never printed.

name: WinPilot - Windows 11 Pro VM

on:
  workflow_dispatch:
    inputs:
      windows_username:
        description: 'Windows user created at first install (letters, digits, _ or -, 3-20 characters)'
        required: false
        default: 'winpilot'
        type: string
      enable_rdp:
        description: 'Check the RDP port (3389) before reporting the VM as ready'
        required: false
        default: true
        type: boolean
      use_tailscale:
        description: 'Join Tailscale (requires the TS_AUTHKEY secret)'
        required: false
        default: true
        type: boolean
      session_minutes:
        description: 'Session length after Windows is ready, in minutes (5-120)'
        required: false
        default: '60'
        type: string

permissions:
  contents: write  # create and prune backup pre-releases

concurrency:
  group: winpilot-vm-${{ github.repository }}
  cancel-in-progress: false  # never run two sessions against the same backup chain

jobs:
  vm:
    name: Windows 11 Pro VM session
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      WIN_USER: ${{ inputs.windows_username }}
      ENABLE_RDP: ${{ inputs.enable_rdp }}
      USE_TAILSCALE: ${{ inputs.use_tailscale }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      GH_TOKEN: ${{ github.token }}
      VM_NAME: winpilot-vm
      STORE: /home/runner/winpilot-storage
      SCRATCH: /home/runner/winpilot-scratch
    steps:
      - name: 'WinPilot: check inputs and secrets'
        env:
          WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=preflight"
          if ! [[ "$WIN_USER" =~ ^[A-Za-z][A-Za-z0-9_-]{2,19}$ ]]; then
            echo "WINPILOT|ERROR=invalid_username"; echo "::error::Invalid Windows username."; exit 1
          fi
          case "${WIN_USER,,}" in administrator|guest|defaultaccount|wdagutilityaccount|system|admin)
            echo "WINPILOT|ERROR=reserved_username"; echo "::error::That Windows username is reserved."; exit 1 ;;
          esac
          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] || [ "$SESSION_MINUTES" -lt 5 ] || [ "$SESSION_MINUTES" -gt 120 ]; then
            echo "WINPILOT|ERROR=invalid_session_minutes"; echo "::error::session_minutes must be 5-120."; exit 1
          fi
          if [ -z "$WIN_PASSWORD" ]; then
            echo "WINPILOT|ERROR=missing_password_secret"
            echo "::error::Secret WINPILOT_WIN_PASSWORD is missing. Set it in repository settings or from WinPilot."; exit 1
          fi
          echo "::add-mask::$WIN_PASSWORD"
          if [ "${#WIN_PASSWORD}" -lt 12 ] || ! [[ "$WIN_PASSWORD" =~ [A-Z] && "$WIN_PASSWORD" =~ [a-z] && "$WIN_PASSWORD" =~ [0-9] && "$WIN_PASSWORD" =~ [^A-Za-z0-9] ]]; then
            echo "WINPILOT|ERROR=weak_password_secret"
            echo "::error::WINPILOT_WIN_PASSWORD must be 12+ characters with upper, lower, digit and symbol."; exit 1
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "WINPILOT|ERROR=missing_backup_secret"
            echo "::error::Secret BACKUP_PASSWORD is missing. Backups cannot be encrypted without it."; exit 1
          fi
          echo "::add-mask::$BACKUP_PASSWORD"
          if [ "${#BACKUP_PASSWORD}" -lt 16 ]; then
            echo "WINPILOT|ERROR=weak_backup_secret"; echo "::error::BACKUP_PASSWORD must be at least 16 characters."; exit 1
          fi
          if [ "$USE_TAILSCALE" = "true" ] && [ -n "$TS_AUTHKEY" ]; then
            echo "::add-mask::$TS_AUTHKEY"
            echo "WINPILOT|TS_SECRET=present"
          else
            echo "WINPILOT|TS_SECRET=absent"
          fi
          echo "WINPILOT|WIN_USER=$WIN_USER"
          echo "WINPILOT|PREFLIGHT=ok"

      - name: 'WinPilot: free runner disk space'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
          echo "WINPILOT|DISK_FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

      - name: 'WinPilot: check KVM'
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=kvm"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          if [ ! -e /dev/kvm ]; then
            echo "WINPILOT|KVM=missing"; echo "::error::/dev/kvm is not available on this runner. The VM cannot start."; exit 1
          fi
          echo "WINPILOT|KVM=available"

      - name: 'WinPilot: restore the latest valid backup'
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=restore"
          mkdir -p "$STORE" "$SCRATCH"
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq zstd >/dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("win-backup-"))] | sort_by(.createdAt) | reverse | .[].tagName' \
            > "$SCRATCH/backup-tags.txt" || true
          restored=""
          tried=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            tried=$((tried + 1)); [ "$tried" -gt 3 ] && break
            dir="$SCRATCH/restore"; rm -rf "$dir"; mkdir -p "$dir"
            echo "WINPILOT|RESTORE_TRY=$tag"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p manifest.json -D "$dir" 2>/dev/null; then
              echo "WINPILOT|RESTORE_STATE=manifest_download_failed"; continue
            fi
            parts=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("\n".join(p["name"] for p in m["parts"]))' "$dir/manifest.json")
            ok=true
            for p in $parts; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$p" -D "$dir" || { ok=false; break; }
            done
            if [ "$ok" != true ]; then echo "WINPILOT|RESTORE_STATE=part_download_failed"; continue; fi
            if ! python3 - "$dir" <<'PY'
          import hashlib, json, sys, os
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, "manifest.json")))
          for p in m["parts"]:
              h = hashlib.sha256(open(os.path.join(d, p["name"]), "rb").read()).hexdigest()
              if h != p["sha256"]:
                  sys.exit(f"checksum mismatch for {p['name']}")
          PY
            then echo "WINPILOT|RESTORE_STATE=checksum_failed"; continue; fi
            cat $(for p in $parts; do echo "$dir/$p"; done) > "$dir/archive.enc"
            want=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$dir/manifest.json")
            got=$(sha256sum "$dir/archive.enc" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then echo "WINPILOT|RESTORE_STATE=archive_checksum_failed"; continue; fi
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:BACKUP_PASSWORD -in "$dir/archive.enc" \
                 | zstd -d -q -c | tar -xSf - -C "$STORE"; then
              # Checksums matched, so this is the password or a format problem, not corruption.
              echo "WINPILOT|RESTORE_STATE=decrypt_failed"
              echo "::error::Could not decrypt the backup. Check that BACKUP_PASSWORD is the same password used when the backup was created."
              exit 1
            fi
            rm -rf "$dir"
            restored="$tag"
            echo "WINPILOT|RESTORE_STATE=restored"
            echo "WINPILOT|RESTORED_FROM=$tag"
            break
          done < "$SCRATCH/backup-tags.txt"
          if [ -z "$restored" ]; then
            echo "WINPILOT|MODE=first_install"
            echo "WINPILOT|STAGE=first_install"
            echo "No valid backup found. Windows will be installed from scratch."
          else
            echo "WINPILOT|MODE=restore"
          fi
          du -sh "$STORE" || true

      - name: 'WinPilot: start Windows 11 Pro VM'
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=vm_start"
          ENV_FILE="$SCRATCH/vm.env"
          umask 077
          {
            echo "VERSION=11"
            echo "USERNAME=$WIN_USER"
            echo "PASSWORD=$WINPILOT_WIN_PASSWORD"
            echo "RAM_SIZE=8G"
            echo "CPU_CORES=4"
            echo "DISK_SIZE=64G"
          } > "$ENV_FILE"
          PORTS=(-p 3389:3389/tcp -p 3389:3389/udp)
          docker run -d --name "$VM_NAME" --env-file "$ENV_FILE" \
            --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN \
            --stop-timeout 120 -v "$STORE:/storage" "${PORTS[@]}" dockurr/windows >/dev/null
          rm -f "$ENV_FILE"
          sleep 5
          if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
            echo "WINPILOT|ERROR=vm_container_exited"
            docker logs --tail 40 "$VM_NAME" 2>&1 | python3 -c 'import sys,os; s=sys.stdin.read(); p=os.environ.get("WINPILOT_WIN_PASSWORD",""); print(s.replace(p,"***") if p else s)' || true
            exit 1
          fi
          echo "WINPILOT|VM_CONTAINER=started"
        env:
          WINPILOT_WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}

      - name: 'WinPilot: wait for Windows readiness'
        env:
          WINPILOT_WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=windows_boot"
          deadline=$(( $(date +%s) + 200 * 60 ))
          rdp_ready=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
              echo "WINPILOT|ERROR=vm_stopped_before_ready"
              docker logs --tail 60 "$VM_NAME" 2>&1 | python3 -c 'import sys,os; s=sys.stdin.read(); p=os.environ.get("WINPILOT_WIN_PASSWORD",""); print(s.replace(p,"***") if p else s)' || true
              exit 1
            fi
            if [ "$ENABLE_RDP" != "true" ] || timeout 2 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              rdp_ready=true; break
            fi
            sleep 20
          done
          if [ "$rdp_ready" != true ]; then
            echo "WINPILOT|ERROR=windows_not_ready_timeout"
            echo "::error::Windows did not open RDP within 200 minutes."; exit 1
          fi
          date +%s > "$SCRATCH/ready_at"
          touch "$SCRATCH/ready.flag"
          # The VM image is Windows 11 Pro x64 (dockur VERSION=11). This marks the configured image, not a value read from inside Windows.
          echo "WINPILOT|ARCH=x64"
          echo "WINPILOT|RDP_PORT_OPEN=true"
          echo "WINPILOT|WINDOWS_READY=true"
          echo "WINPILOT|RDP_READY=$ENABLE_RDP"
          echo "WINPILOT|READY_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 'WinPilot: join Tailscale'
        if: ${{ inputs.use_tailscale }}
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=tailscale"
          if [ -z "$TS_AUTHKEY" ]; then
            echo "WINPILOT|TS_STATE=missing_secret"
            echo "::warning::TS_AUTHKEY is not set. Tailscale is not connected."
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sudo sh >/dev/null
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="winpilot-$GITHUB_RUN_ID" --accept-dns=false --timeout=90s
          ip=$(tailscale ip -4 | head -1 || true)
          if ! python3 -c 'import ipaddress,sys; a=ipaddress.ip_address(sys.argv[1]); sys.exit(0 if a in ipaddress.ip_network("100.64.0.0/10") else 1)' "$ip" 2>/dev/null; then
            echo "WINPILOT|TS_STATE=no_tailscale_ip"; echo "::error::Tailscale did not return a 100.64.0.0/10 address."; exit 1
          fi
          echo "WINPILOT|TS_STATE=connected"
          echo "WINPILOT|TS_IP=$ip"
          echo "WINPILOT|TS_NOTE=The phone must probe TCP $ip:3389 to confirm RDP is reachable."

      - name: 'WinPilot: session'
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=session"
          end=$(( $(cat "$SCRATCH/ready_at") + SESSION_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
              echo "WINPILOT|SESSION_END=vm_stopped"; exit 0
            fi
            echo "WINPILOT|REMAINING_SECONDS=$(( end - $(date +%s) ))"
            sleep 30
          done
          echo "WINPILOT|SESSION_END=time_limit"

      - name: 'WinPilot: stop Windows safely and back up'
        if: ${{ always() }}
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -uo pipefail
          echo "WINPILOT|STAGE=shutdown"
          if docker ps -q --filter "name=$VM_NAME" | grep -q .; then
            docker stop -t 110 "$VM_NAME" >/dev/null || true
          fi
          if [ ! -f "$SCRATCH/ready.flag" ]; then
            echo "WINPILOT|BACKUP=skipped_not_ready"
            echo "Windows never became ready, so the disk is not saved. A partial install is never used as a backup."
            exit 0
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "WINPILOT|BACKUP=failed_missing_secret"; exit 1
          fi
          echo "WINPILOT|STAGE=backup"
          tag="win-backup-$(date -u +%Y%m%d-%H%M%S)-run$GITHUB_RUN_NUMBER"
          out="$SCRATCH/backup"; rm -rf "$out"; mkdir -p "$out"
          archive="$SCRATCH/backup.tar.zst.enc"
          set -e
          tar -cSf - -C "$STORE" --exclude='*.iso' --exclude='./tmp' --exclude='setup.img' . \
            | zstd -T0 -6 -q \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:BACKUP_PASSWORD -out "$archive"
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          split -b 1900M -d -a 3 "$archive" "$out/part-"
          rm -f "$archive"
          python3 - "$out" "$archive_sha" "$tag" <<'PY'
          import hashlib, json, os, sys, datetime
          out, archive_sha, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          parts = []
          for name in sorted(n for n in os.listdir(out) if n.startswith("part-")):
              path = os.path.join(out, name)
              h = hashlib.sha256(open(path, "rb").read()).hexdigest()
              parts.append({"name": name, "sha256": h, "bytes": os.path.getsize(path)})
          m = {"format": "winpilot-vm-backup-v1", "tag": tag,
               "created": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
               "cipher": "aes-256-cbc-pbkdf2-300000", "compression": "zstd",
               "archive_sha256": archive_sha, "parts": parts}
          json.dump(m, open(os.path.join(out, "manifest.json"), "w"), indent=2)
          PY
          set +e
          if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
               --title "Windows backup $tag" \
               --notes "Encrypted Windows 11 Pro disk backup (WinPilot). Requires BACKUP_PASSWORD to restore. Do not publish." \
               "$out"/part-* "$out/manifest.json"; then
            echo "WINPILOT|BACKUP=upload_failed"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            exit 1
          fi
          # Verify the uploaded copy by downloading it again and comparing checksums.
          verify="$SCRATCH/verify"; rm -rf "$verify"; mkdir -p "$verify"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p manifest.json -D "$verify" && \
          python3 - "$verify" <<'PY'
          import hashlib, json, os, sys, subprocess
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, "manifest.json")))
          for p in m["parts"]:
              subprocess.run(["gh", "release", "download", m["tag"], "--repo", os.environ["GITHUB_REPOSITORY"], "-p", p["name"], "-D", d], check=True)
              h = hashlib.sha256(open(os.path.join(d, p["name"]), "rb").read()).hexdigest()
              if h != p["sha256"]:
                  sys.exit(f"uploaded {p['name']} does not match")
          PY
          if [ $? -ne 0 ]; then
            echo "WINPILOT|BACKUP=verify_failed"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            exit 1
          fi
          echo "WINPILOT|BACKUP=verified"
          echo "WINPILOT|BACKUP_TAG=$tag"
          # Keep the two newest valid backups. Older ones are deleted only now, after the new one is verified.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("win-backup-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old; do
                [ -z "$old" ] && continue
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 \
                  && echo "WINPILOT|PRUNED=$old" || echo "WINPILOT|PRUNE_FAILED=$old"
              done
          rm -rf "$out" "$verify"

      - name: 'WinPilot: cleanup'
        if: ${{ always() }}
        run: |
          sudo tailscale logout >/dev/null 2>&1 || true
          docker rm -f "$VM_NAME" >/dev/null 2>&1 || true
          echo "WINPILOT|STAGE=done"
