name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APK as a GitHub pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used by the optional pre-release step
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffolding
        run: |
          rm -rf /tmp/wp_gen android
          tool/ci/run_logged.sh scaffold flutter create --platforms=android --org com.winpilot --project-name winpilot /tmp/wp_gen
          cp -r /tmp/wp_gen/android ./android
          tool/ci/run_logged.sh patch python3 tool/ci/patch_android.py android

      - name: Check i18n keys
        run: tool/ci/run_logged.sh i18n python3 tool/check_i18n_keys.py

      - name: Resolve dependencies
        run: tool/ci/run_logged.sh pub-get flutter pub get

      - name: Analyze
        run: tool/ci/run_logged.sh analyze flutter analyze --no-fatal-infos

      - name: Test
        run: tool/ci/run_logged.sh test flutter test --reporter expanded

      - name: Build release APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.WINPILOT_GITHUB_CLIENT_ID }}
        run: |
          tool/ci/run_logged.sh build flutter build apk --release --dart-define=GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID

      - name: Verify APK metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" > badging.txt
          cat badging.txt | head -20
          grep -q "name='com.winpilot.winpilot'" badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt
          grep -q "application-label:'WinPilot'" badging.txt
          sha256sum "$APK" | tee "$APK.sha256"
          mkdir -p dist
          cp "$APK" dist/WinPilot-release.apk
          cp "$APK.sha256" dist/WinPilot-release.apk.sha256
          echo "APK_BYTES=$(stat -c %s "$APK")" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPilot-release-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="winpilot-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/WinPilot-release.apk dist/WinPilot-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "WinPilot Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Release APK built by GitHub Actions from commit ${GITHUB_SHA}. Debug-style signing; verify the SHA-256 before installing."
