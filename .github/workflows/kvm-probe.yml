# Diagnostic only: checks whether a GitHub-hosted Linux runner can run KVM for dockur/windows.
name: KVM probe (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe KVM and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Host facts
        run: |
          set -x
          uname -a
          grep -m1 -E 'vmx|svm' /proc/cpuinfo | wc -l
          nproc; free -h; df -h /
          ls -l /dev/kvm || echo "NO /dev/kvm"
          ls -l /dev/net/tun || echo "NO /dev/net/tun"
          docker --version
          lsmod | grep -E 'kvm' || true

      - name: Try to enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "still no /dev/kvm"
          if [ -e /dev/kvm ]; then
            sudo apt-get install -y -q cpu-checker >/dev/null 2>&1 || true
            kvm-ok || true
          fi

      - name: Start a privileged container with /dev/kvm
        run: |
          set -x
          if [ ! -e /dev/kvm ]; then echo "::error::no /dev/kvm"; exit 1; fi
          docker run --rm --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN alpine:3.20 sh -c 'ls -l /dev/kvm && cat /proc/cpuinfo | grep -m1 -E "vmx|svm"'
