# WinPilot - Windows 11 Pro virtual machine session (managed by the WinPilot app).
#
# How it works
# - Runs Windows 11 Pro (x64) inside Docker with KVM, using the open-source dockur/windows
#   image: https://github.com/dockur/windows
# - Runner: ubuntu-latest. KVM is checked at the start of every run. The job fails if /dev/kvm
#   is missing; there is no silent fallback. KVM on hosted runners is NOT guaranteed.
# - Windows user and password come from the repository secret WINPILOT_WIN_PASSWORD and are
#   passed to the VM at first install only. They are masked in logs.
# - The VM disk is saved at the end of every session as an encrypted backup (BACKUP_PASSWORD)
#   in a pre-release named win-backup-*. The newest valid backups are restored next time.
#   The last two valid backups are kept; older ones are deleted only after a new backup is
#   uploaded and re-downloaded with matching checksums.
# - Browser access: dockur's web viewer (port 8006) is bound to 127.0.0.1 only and is reached
#   through an nginx front that requires ACCESS_PASSWORD (HTTP Basic auth). A temporary
#   Cloudflare quick tunnel exposes that front. The tunnel URL is never printed to the log; it
#   is stored encrypted with ACCESS_PASSWORD in the artifact winpilot-access.
# - Runner files are removed when the job ends. The backup release is the only persistent state.
#
# Honest limits
# - A finished workflow run does NOT mean Windows or RDP is ready. The readiness step checks the
#   RDP port inside the VM; the app checks the Tailscale address from the phone.
# - Losing BACKUP_PASSWORD makes existing backups unreadable.
# - Runner disk is limited (about 14 GB free after cleanup on hosted runners); the storage
#   checks below stop the run before a backup or restore can fill it.
#
# Markers "WINPILOT|KEY=VALUE" are parsed by the app. Secrets and URLs are never printed.

name: WinPilot - Windows 11 Pro VM

on:
  workflow_dispatch:
    inputs:
      windows_username:
        description: 'Windows user created at first install (letters, digits, _ or -, 3-20 characters)'
        required: false
        default: 'winpilot'
        type: string
      enable_rdp:
        description: 'Check the RDP port (3389) before reporting the VM as ready'
        required: false
        default: true
        type: boolean
      use_tailscale:
        description: 'Join Tailscale (requires the TS_AUTHKEY secret)'
        required: false
        default: false
        type: boolean
      session_minutes:
        description: 'Session length after Windows is ready, in minutes (5-120)'
        required: false
        default: '60'
        type: string

permissions:
  contents: write  # create and prune backup pre-releases
  actions: read    # read the workflow's own run metadata

concurrency:
  group: winpilot-vm-${{ github.repository }}
  cancel-in-progress: false  # never run two sessions against the same backup chain

jobs:
  vm:
    name: Windows 11 Pro VM session
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      WIN_USER: ${{ inputs.windows_username || 'winpilot' }}
      ENABLE_RDP: ${{ format('{0}', inputs.enable_rdp) == 'false' && 'false' || 'true' }}
      USE_TAILSCALE: ${{ format('{0}', inputs.use_tailscale) == 'true' && 'true' || 'false' }}
      SESSION_MINUTES: ${{ inputs.session_minutes || '60' }}
      GH_TOKEN: ${{ github.token }}
      VM_NAME: winpilot-vm
      STORE: /home/runner/winpilot-storage
      SCRATCH: /home/runner/winpilot-scratch
    steps:
      - name: 'WinPilot: check inputs and secrets'
        env:
          WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=preflight"
          if ! [[ "$WIN_USER" =~ ^[A-Za-z][A-Za-z0-9_-]{2,19}$ ]]; then
            echo "WINPILOT|ERROR=invalid_username"; echo "::error::Invalid Windows username."; exit 1
          fi
          case "${WIN_USER,,}" in administrator|guest|defaultaccount|wdagutilityaccount|system|admin)
            echo "WINPILOT|ERROR=reserved_username"; echo "::error::That Windows username is reserved."; exit 1 ;;
          esac
          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] || [ "$SESSION_MINUTES" -lt 5 ] || [ "$SESSION_MINUTES" -gt 120 ]; then
            echo "WINPILOT|ERROR=invalid_session_minutes"; echo "::error::session_minutes must be 5-120."; exit 1
          fi
          if [ -z "$WIN_PASSWORD" ]; then
            echo "WINPILOT|ERROR=missing_password_secret"
            echo "::error::Secret WINPILOT_WIN_PASSWORD is missing. Set it in repository settings or from WinPilot."; exit 1
          fi
          echo "::add-mask::$WIN_PASSWORD"
          if [ "${#WIN_PASSWORD}" -lt 12 ] || [ "${#WIN_PASSWORD}" -gt 127 ] || [[ "$WIN_PASSWORD" =~ [[:cntrl:]] ]] \
             || ! [[ "$WIN_PASSWORD" =~ [A-Z] && "$WIN_PASSWORD" =~ [a-z] && "$WIN_PASSWORD" =~ [0-9] && "$WIN_PASSWORD" =~ [^A-Za-z0-9] ]]; then
            echo "WINPILOT|ERROR=weak_password_secret"
            echo "::error::WINPILOT_WIN_PASSWORD must be 12-127 characters with upper, lower, digit and symbol, without control characters."; exit 1
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "WINPILOT|ERROR=missing_backup_secret"
            echo "::error::Secret BACKUP_PASSWORD is missing. Backups cannot be encrypted without it."; exit 1
          fi
          echo "::add-mask::$BACKUP_PASSWORD"
          if [ "${#BACKUP_PASSWORD}" -lt 16 ]; then
            echo "WINPILOT|ERROR=weak_backup_secret"; echo "::error::BACKUP_PASSWORD must be at least 16 characters."; exit 1
          fi
          if [ -z "$ACCESS_PASSWORD" ]; then
            echo "WINPILOT|ERROR=missing_access_secret"
            echo "::error::Secret ACCESS_PASSWORD is missing. The browser access page cannot be protected without it."; exit 1
          fi
          echo "::add-mask::$ACCESS_PASSWORD"
          if [ "${#ACCESS_PASSWORD}" -lt 12 ]; then
            echo "WINPILOT|ERROR=weak_access_secret"; echo "::error::ACCESS_PASSWORD must be at least 12 characters."; exit 1
          fi
          if [ "$USE_TAILSCALE" = "true" ] && [ -n "$TS_AUTHKEY" ]; then
            echo "::add-mask::$TS_AUTHKEY"
            echo "WINPILOT|TS_SECRET=present"
          else
            echo "WINPILOT|TS_SECRET=absent"
          fi
          echo "WINPILOT|WIN_USER=$WIN_USER"
          echo "WINPILOT|PREFLIGHT=ok"

      - name: 'WinPilot: free runner disk space'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
          echo "WINPILOT|DISK_FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

      - name: 'WinPilot: check KVM'
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=kvm"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          if [ ! -e /dev/kvm ]; then
            echo "WINPILOT|KVM=missing"; echo "::error::/dev/kvm is not available on this runner. The VM cannot start."; exit 1
          fi
          echo "WINPILOT|KVM=available"

      - name: 'WinPilot: restore the latest valid backup'
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=restore"
          mkdir -p "$STORE" "$SCRATCH"
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq zstd >/dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("win-backup-"))] | sort_by(.createdAt) | reverse | .[].tagName' \
            > "$SCRATCH/backup-tags.txt" || true
          avail_bytes() { df -B1 --output=avail "$1" | tail -1 | tr -dc '0-9'; }
          restored=""
          tried=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            tried=$((tried + 1)); [ "$tried" -gt 3 ] && break
            dir="$SCRATCH/restore"; rm -rf "$dir"; mkdir -p "$dir"
            echo "WINPILOT|RESTORE_TRY=$tag"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p manifest.json -D "$dir" 2>/dev/null; then
              echo "WINPILOT|RESTORE_STATE=manifest_download_failed"; continue
            fi
            if ! python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["format"]=="winpilot-vm-backup-v1"' "$dir/manifest.json" 2>/dev/null; then
              echo "WINPILOT|RESTORE_STATE=manifest_invalid"; continue
            fi
            parts=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("\n".join(p["name"] for p in m["parts"]))' "$dir/manifest.json")
            total=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(sum(p["bytes"] for p in m["parts"]))' "$dir/manifest.json")
            # Parts are streamed, not joined. Keep room for the parts plus the extracted disk.
            need=$(( total * 3 + 2147483648 ))
            if [ "$(avail_bytes "$dir")" -lt "$need" ]; then
              echo "WINPILOT|RESTORE_STATE=low_storage"
              echo "::error::Not enough free disk on the runner to restore the backup safely. Existing backups were not changed."
              exit 1
            fi
            ok=true
            for p in $parts; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$p" -D "$dir" || { ok=false; break; }
            done
            if [ "$ok" != true ]; then echo "WINPILOT|RESTORE_STATE=part_download_failed"; continue; fi
            if ! python3 - "$dir" <<'PY'
          import hashlib, json, sys, os
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, "manifest.json")))
          for p in m["parts"]:
              h = hashlib.sha256(open(os.path.join(d, p["name"]), "rb").read()).hexdigest()
              if h != p["sha256"]:
                  sys.exit(f"checksum mismatch for {p['name']}")
          PY
            then echo "WINPILOT|RESTORE_STATE=checksum_failed"; continue; fi
            want=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$dir/manifest.json")
            got=$(cat $(for p in $parts; do echo "$dir/$p"; done) | sha256sum | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then echo "WINPILOT|RESTORE_STATE=archive_checksum_failed"; continue; fi
            rm -rf "$STORE"; mkdir -p "$STORE"
            set +e
            cat $(for p in $parts; do echo "$dir/$p"; done) \
              | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:BACKUP_PASSWORD \
              | zstd -d -q -c \
              | tar -xSf - -C "$STORE"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              # Checksums matched, so this is the password or a format problem, not corruption.
              # The backup is not deleted. Do not try older backups with the same password.
              echo "WINPILOT|RESTORE_STATE=decrypt_failed"
              echo "::error::Could not decrypt the backup. Check that BACKUP_PASSWORD is the same password used when the backup was created."
              exit 1
            fi
            rm -rf "$dir"
            restored="$tag"
            echo "WINPILOT|RESTORE_STATE=restored"
            echo "WINPILOT|RESTORED_FROM=$tag"
            break
          done < "$SCRATCH/backup-tags.txt"
          if [ -z "$restored" ]; then
            echo "WINPILOT|MODE=first_install"
            echo "WINPILOT|STAGE=first_install"
            echo "No valid backup found. Windows will be installed from scratch."
          else
            echo "WINPILOT|MODE=restore"
          fi
          du -sh "$STORE" || true

      - name: 'WinPilot: start Windows 11 Pro VM'
        env:
          WINPILOT_WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=vm_start"
          ENV_FILE="$SCRATCH/vm.env"
          umask 077
          {
            echo "VERSION=11"
            echo "USERNAME=$WIN_USER"
            echo "PASSWORD=$WINPILOT_WIN_PASSWORD"
            echo "RAM_SIZE=8G"
            echo "CPU_CORES=4"
            echo "DISK_SIZE=64G"
          } > "$ENV_FILE"
          # The web viewer stays on loopback; only the nginx front (password protected) reaches it.
          # RDP is published on the host so the readiness check and Tailscale can reach it.
          docker run -d --name "$VM_NAME" --env-file "$ENV_FILE" \
            --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN \
            --stop-timeout 120 -v "$STORE:/storage" \
            -p 127.0.0.1:8006:8006 -p 3389:3389/tcp -p 3389:3389/udp \
            dockurr/windows >/dev/null
          rm -f "$ENV_FILE"
          sleep 5
          if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
            echo "WINPILOT|ERROR=vm_container_exited"
            docker logs --tail 40 "$VM_NAME" 2>&1 | python3 -c 'import sys,os; s=sys.stdin.read(); p=os.environ.get("WINPILOT_WIN_PASSWORD",""); print(s.replace(p,"***") if p else s)' || true
            exit 1
          fi
          echo "WINPILOT|VM_CONTAINER=started"

      - name: 'WinPilot: start protected browser access'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          set -uo pipefail
          echo "WINPILOT|STAGE=browser_access"
          umask 077
          mkdir -p "$SCRATCH/nginx-tmp" "$SCRATCH/access-out"
          if ! command -v nginx >/dev/null; then
            sudo apt-get install -y -qq nginx >/dev/null || { echo "WINPILOT|ACCESS_STATE=nginx_install_failed"; exit 0; }
          fi
          printf 'winpilot:%s\n' "$(printf '%s' "$ACCESS_PASSWORD" | openssl passwd -apr1 -stdin)" > "$SCRATCH/htpasswd"
          cat > "$SCRATCH/nginx.conf" <<'NGINX'
          user RUNNER_USER;
          worker_processes 1;
          pid SCRATCH_DIR/nginx.pid;
          error_log SCRATCH_DIR/nginx-error.log warn;
          events { worker_connections 256; }
          http {
            access_log off;
            client_body_temp_path SCRATCH_DIR/nginx-tmp/body;
            proxy_temp_path SCRATCH_DIR/nginx-tmp/proxy;
            map $http_upgrade $connection_upgrade { default upgrade; '' close; }
            server {
              listen 127.0.0.1:8080;
              auth_basic "WinPilot session";
              auth_basic_user_file SCRATCH_DIR/htpasswd;
              location / {
                proxy_pass http://127.0.0.1:8006;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
              }
            }
          }
          NGINX
          sed -i "s#SCRATCH_DIR#$SCRATCH#g; s#RUNNER_USER#$(id -un)#g" "$SCRATCH/nginx.conf"
          if ! sudo nginx -t -c "$SCRATCH/nginx.conf" >/dev/null 2>&1; then
            echo "WINPILOT|ACCESS_STATE=nginx_config_failed"; exit 0
          fi
          sudo nginx -c "$SCRATCH/nginx.conf"
          # Local check with the password header kept in a file (not on the command line).
          printf 'Authorization: Basic %s\n' "$(printf 'winpilot:%s' "$ACCESS_PASSWORD" | base64 -w0)" > "$SCRATCH/auth.hdr"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$SCRATCH/auth.hdr" http://127.0.0.1:8080/ || true)
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
          if [ "$anon" != "401" ]; then echo "WINPILOT|ACCESS_STATE=anonymous_not_blocked"; exit 0; fi
          echo "WINPILOT|ACCESS_LOCAL_HTTP=$code"
          # Temporary public tunnel. Its URL goes only into an encrypted file, never into the log.
          arch=amd64
          curl -fsSL -o "$SCRATCH/cloudflared" "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$arch" \
            && chmod +x "$SCRATCH/cloudflared" || { echo "WINPILOT|ACCESS_STATE=cloudflared_download_failed"; exit 0; }
          rm -f "$SCRATCH/cloudflared.log"
          setsid nohup "$SCRATCH/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8080 --logfile "$SCRATCH/cloudflared.log" >/dev/null 2>&1 < /dev/null &
          echo $! > "$SCRATCH/cloudflared.pid"
          url=""
          for _ in $(seq 1 30); do
            url=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$SCRATCH/cloudflared.log" 2>/dev/null | head -1 || true)
            [ -n "$url" ] && break
            sleep 4
          done
          if [ -z "$url" ]; then echo "WINPILOT|ACCESS_STATE=tunnel_no_url"; exit 0; fi
          ok=false
          for _ in $(seq 1 10); do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H @"$SCRATCH/auth.hdr" "$url/" || true)
            if [ "$c" = "200" ]; then ok=true; break; fi
            sleep 6
          done
          if [ "$ok" != true ]; then echo "WINPILOT|ACCESS_STATE=tunnel_check_failed"; exit 0; fi
          printf '%s' "$url" | openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:ACCESS_PASSWORD -out "$SCRATCH/access-out/access.enc"
          echo "WINPILOT|ACCESS_STATE=ready_encrypted"
          echo "WINPILOT|ACCESS_NOTE=Open the access link in WinPilot with ACCESS_PASSWORD. The link is not printed here."

      - name: 'WinPilot: publish encrypted access link'
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: winpilot-access
          path: /home/runner/winpilot-scratch/access-out/access.enc
          retention-days: 1
          if-no-files-found: ignore

      - name: 'WinPilot: wait for Windows readiness'
        env:
          WINPILOT_WIN_PASSWORD: ${{ secrets.WINPILOT_WIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=windows_boot"
          deadline=$(( $(date +%s) + 200 * 60 ))
          rdp_ready=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
              echo "WINPILOT|ERROR=vm_stopped_before_ready"
              docker logs --tail 60 "$VM_NAME" 2>&1 | python3 -c 'import sys,os; s=sys.stdin.read(); p=os.environ.get("WINPILOT_WIN_PASSWORD",""); print(s.replace(p,"***") if p else s)' || true
              exit 1
            fi
            if [ "$ENABLE_RDP" != "true" ] || timeout 2 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              rdp_ready=true; break
            fi
            sleep 20
          done
          if [ "$rdp_ready" != true ]; then
            echo "WINPILOT|ERROR=windows_not_ready_timeout"
            echo "::error::Windows did not open RDP within 200 minutes."; exit 1
          fi
          date +%s > "$SCRATCH/ready_at"
          touch "$SCRATCH/ready.flag"
          # The image is Windows 11 Pro x64 (dockur VERSION=11). This marks the configured image,
          # not a value read from inside Windows.
          echo "WINPILOT|ARCH=x64"
          echo "WINPILOT|RDP_PORT_OPEN=true"
          echo "WINPILOT|WINDOWS_READY=true"
          echo "WINPILOT|RDP_READY=$ENABLE_RDP"
          echo "WINPILOT|READY_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 'WinPilot: join Tailscale'
        if: ${{ env.USE_TAILSCALE == 'true' }}
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=tailscale"
          if [ -z "$TS_AUTHKEY" ]; then
            echo "WINPILOT|TS_STATE=missing_secret"
            echo "::warning::TS_AUTHKEY is not set. Tailscale is not connected."
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sudo sh >/dev/null
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="winpilot-$GITHUB_RUN_ID" --accept-dns=false --timeout=90s
          ip=$(tailscale ip -4 | head -1 || true)
          if ! python3 -c 'import ipaddress,sys; a=ipaddress.ip_address(sys.argv[1]); sys.exit(0 if a in ipaddress.ip_network("100.64.0.0/10") else 1)' "$ip" 2>/dev/null; then
            echo "WINPILOT|TS_STATE=no_tailscale_ip"; echo "::error::Tailscale did not return a 100.64.0.0/10 address."; exit 1
          fi
          echo "WINPILOT|TS_STATE=connected"
          echo "WINPILOT|TS_IP=$ip"
          echo "WINPILOT|TS_NOTE=The phone must probe TCP $ip:3389 to confirm RDP is reachable."

      - name: 'WinPilot: session'
        run: |
          set -euo pipefail
          echo "WINPILOT|STAGE=session"
          end=$(( $(cat "$SCRATCH/ready_at") + SESSION_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! docker ps -q --filter "name=$VM_NAME" | grep -q .; then
              echo "WINPILOT|SESSION_END=vm_stopped"; exit 0
            fi
            echo "WINPILOT|REMAINING_SECONDS=$(( end - $(date +%s) ))"
            sleep 30
          done
          echo "WINPILOT|SESSION_END=time_limit"

      - name: 'WinPilot: stop Windows safely and back up'
        if: ${{ always() }}
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -uo pipefail
          echo "WINPILOT|STAGE=shutdown"
          if docker ps -q --filter "name=$VM_NAME" | grep -q .; then
            docker stop -t 110 "$VM_NAME" >/dev/null || true
          fi
          if [ ! -f "$SCRATCH/ready.flag" ]; then
            echo "WINPILOT|BACKUP=skipped_not_ready"
            echo "Windows never became ready, so the disk is not saved. A partial install is never used as a backup."
            exit 0
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "WINPILOT|BACKUP=failed_missing_secret"; exit 1
          fi
          echo "WINPILOT|STAGE=backup"
          # Need room for the encrypted parts (up to the used size) plus margin. Checked before writing.
          used=$(du -sB1 "$STORE" | cut -f1)
          free=$(df -B1 --output=avail "$SCRATCH" | tail -1 | tr -dc '0-9')
          if [ "$free" -lt $(( used + 2147483648 )) ]; then
            echo "WINPILOT|BACKUP=failed_low_storage"
            echo "::error::Not enough free disk to write the backup. The previous backups were not changed."
            exit 1
          fi
          tag="win-backup-$(date -u +%Y%m%d-%H%M%S)-run$GITHUB_RUN_NUMBER"
          out="$SCRATCH/backup"; rm -rf "$out"; mkdir -p "$out"
          set -e
          # Streamed: tar -> zstd -> AES -> split. No full plaintext or ciphertext copy on disk.
          tar -cSf - -C "$STORE" --exclude='*.iso' --exclude='./tmp' --exclude='setup.img' . \
            | zstd -T0 -6 -q \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:BACKUP_PASSWORD \
            | split -b 1900M -d -a 3 - "$out/part-"
          archive_sha=$(cat "$out"/part-* | sha256sum | cut -d' ' -f1)
          python3 - "$out" "$archive_sha" "$tag" <<'PY'
          import hashlib, json, os, sys, datetime
          out, archive_sha, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          parts = []
          for name in sorted(n for n in os.listdir(out) if n.startswith("part-")):
              path = os.path.join(out, name)
              h = hashlib.sha256(open(path, "rb").read()).hexdigest()
              parts.append({"name": name, "sha256": h, "bytes": os.path.getsize(path)})
          m = {"format": "winpilot-vm-backup-v1", "tag": tag,
               "created": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
               "cipher": "aes-256-cbc-pbkdf2-300000", "compression": "zstd",
               "archive_sha256": archive_sha, "parts": parts}
          json.dump(m, open(os.path.join(out, "manifest.json"), "w"), indent=2)
          PY
          set +e
          if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
               --title "Windows backup $tag" \
               --notes "Encrypted Windows 11 Pro disk backup (WinPilot). Requires BACKUP_PASSWORD to restore. Do not publish." \
               "$out"/part-* "$out/manifest.json"; then
            echo "WINPILOT|BACKUP=upload_failed"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            exit 1
          fi
          # Free local copies, then verify what GitHub stored by downloading it again.
          rm -rf "$out"
          verify="$SCRATCH/verify"; rm -rf "$verify"; mkdir -p "$verify"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p manifest.json -D "$verify"
          verify_ok=true
          for p in $(python3 -c 'import json,sys; print("\n".join(x["name"] for x in json.load(open(sys.argv[1]))["parts"]))' "$verify/manifest.json"); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$p" -D "$verify" || { verify_ok=false; break; }
          done
          if [ "$verify_ok" = true ]; then
            python3 - "$verify" <<'PY' || verify_ok=false
          import hashlib, json, os, sys
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, "manifest.json")))
          for p in m["parts"]:
              h = hashlib.sha256(open(os.path.join(d, p["name"]), "rb").read()).hexdigest()
              if h != p["sha256"]:
                  sys.exit(1)
          PY
          fi
          if [ "$verify_ok" = true ]; then
            got=$(cat "$verify"/part-* | sha256sum | cut -d' ' -f1)
            want=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$verify/manifest.json")
            [ "$got" = "$want" ] || verify_ok=false
          fi
          rm -rf "$verify"
          if [ "$verify_ok" != true ]; then
            echo "WINPILOT|BACKUP=verify_failed"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            exit 1
          fi
          echo "WINPILOT|BACKUP=verified"
          echo "WINPILOT|BACKUP_TAG=$tag"
          # Keep the two newest valid backups. Older ones are deleted only now, after the new one is verified.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("win-backup-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old; do
                [ -z "$old" ] && continue
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 \
                  && echo "WINPILOT|PRUNED=$old" || echo "WINPILOT|PRUNE_FAILED=$old"
              done

      - name: 'WinPilot: cleanup'
        if: ${{ always() }}
        run: |
          if [ -f "$SCRATCH/cloudflared.pid" ]; then kill "$(cat "$SCRATCH/cloudflared.pid")" >/dev/null 2>&1 || true; fi
          sudo nginx -c "$SCRATCH/nginx.conf" -s quit >/dev/null 2>&1 || true
          if [ "$USE_TAILSCALE" = "true" ]; then sudo tailscale logout >/dev/null 2>&1 || true; fi
          docker rm -f "$VM_NAME" >/dev/null 2>&1 || true
          rm -f "$SCRATCH/htpasswd" "$SCRATCH/auth.hdr" "$SCRATCH/cloudflared.log" || true
          echo "WINPILOT|STAGE=done"
