name: winpilot
description: WinPilot - manage temporary Windows 11 ARM64 sessions through GitHub Actions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_local_notifications: ^17.2.4
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/workflows/verify-windows-11.yml
